name: "Build & Push Productcatalog Image to AWS ECR"
on:
  push:
    branches: [ main, productcatalog-s3-irsa ]  # TODO: narrow back to [ main ] once this branch is merged
    paths:
      - 'src/productcatalogservice/**'
permissions:
  id-token: write
  contents: write
jobs:
  build-and-push:         
    name: Build and Push to ECR          
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: DEBUG - decode actual OIDC token claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          JWT=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::327745427643:role/github-oidc-role
          aws-region: ca-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: online-boutique/productcatalogservice
          IMAGE_TAG: ${{ github.sha }}
        run: |
          (cd src/productcatalogservice && docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .)
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          sed -i "s|image: REGISTRY/REPOSITORY:IMAGE_TAG|image: $REGISTRY/$REPOSITORY:$IMAGE_TAG|" release/kubernetes-manifests.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy ${IMAGE_TAG} on productcatalog" && git push  
